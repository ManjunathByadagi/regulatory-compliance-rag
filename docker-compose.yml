version: '3.9'
services:
  api:
    build: .
    container_name: regulatory-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: regulatory-rag-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    command: streamlit run app/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

  dashboard:
    build: .
    container_name: regulatory-rag-dashboard
    ports:
      - "8502:8502"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    command: streamlit run app/ui/dashboard.py --server.port=8502 --server.address=0.0.0.0
